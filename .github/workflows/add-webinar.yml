name: 웨비나 수동 등록 (Add webinar)

# For webinars the scrapers can't reach — e.g. sharedit, which answers GitHub's
# runners with a Cloudflare challenge. Run it from the Actions tab or the
# GitHub mobile app: it records the webinar in config/manual_webinars.yaml,
# rebuilds the dataset/ICS, syncs Google Calendar and pushes to main. Running it
# again with the same site + URL updates that entry (e.g. to add the time).
on:
  workflow_dispatch:
    inputs:
      source:
        description: "사이트"
        type: choice
        options: [sharedit, allshowtv, ddtube, e4ds, talkit, dubiz, chontv, cloit]
        default: sharedit
      url:
        description: "웨비나 상세 URL (예: https://webinar.sharedit.co.kr/posts/36031)"
        required: true
        type: string
      title:
        description: "제목"
        required: true
        type: string
      date:
        description: "날짜 YYYY-MM-DD"
        required: true
        type: string
      time:
        description: "시작 HH:MM (모르면 비워 두기 → 종일 일정)"
        required: false
        type: string
      end:
        description: "종료 HH:MM (선택)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: webinar-manual
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # inputs reach the scripts only via env — never interpolated into shell
      MANUAL_SOURCE: ${{ inputs.source }}
      MANUAL_URL: ${{ inputs.url }}
      MANUAL_TITLE: ${{ inputs.title }}
      MANUAL_DATE: ${{ inputs.date }}
      MANUAL_TIME: ${{ inputs.time }}
      MANUAL_END: ${{ inputs.end }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      GOOGLE_ACCOUNTS_YAML: ${{ secrets.GOOGLE_ACCOUNTS_YAML }}
      CALENDAR_WRITE_INTERVAL_SECONDS: "1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record webinar and rebuild dataset
        run: python -m webinar.manual add && python -m webinar.manual apply

      - name: Commit and push
        run: >-
          scripts/commit_data.sh "chore: add webinar manually ($MANUAL_SOURCE $MANUAL_DATE)"
          bash -c 'python -m webinar.manual add && python -m webinar.manual apply'

      - name: Sync Google Calendar
        run: python -m webinar.calendar_sync --all --strict -v

      - name: Summary
        if: always()
        run: |
          {
            echo "### 수동 등록"
            echo "- 사이트: $MANUAL_SOURCE"
            echo "- 제목: $MANUAL_TITLE"
            echo "- 일시: $MANUAL_DATE ${MANUAL_TIME:-(시간 미정 → 종일)}${MANUAL_END:+ ~ $MANUAL_END}"
            echo "- URL: $MANUAL_URL"
          } >> "$GITHUB_STEP_SUMMARY"
