name: Daily webinar sync

on:
  schedule:
    # twice per day so new/updated webinars are picked up quickly
    - cron: "0 23 * * *"   # 08:00 KST
    - cron: "0 11 * * *"   # 20:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Registration dry-run (no submit)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: webinar-daily
  cancel-in-progress: false

jobs:
  sync:
    # Self-hosted runner (see README "self-hosted 러너"): a home/office network
    # is not Cloudflare-challenged the way GitHub's datacenter runners are.
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      # Google Calendar
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      # Multiple target accounts as one YAML secret (see config/google.example.yaml)
      GOOGLE_ACCOUNTS_YAML: ${{ secrets.GOOGLE_ACCOUNTS_YAML }}
      # Pace writes to avoid per-user Calendar API rate limits.
      CALENDAR_WRITE_INTERVAL_SECONDS: "1.0"
      # Per-site credentials (blank secrets => that site is skipped for registration)
      SITE_ALLSHOWTV_USER: ${{ secrets.SITE_ALLSHOWTV_USER }}
      SITE_ALLSHOWTV_PASS: ${{ secrets.SITE_ALLSHOWTV_PASS }}
      SITE_SHAREDIT_USER: ${{ secrets.SITE_SHAREDIT_USER }}
      SITE_SHAREDIT_PASS: ${{ secrets.SITE_SHAREDIT_PASS }}
      SITE_DDTUBE_USER: ${{ secrets.SITE_DDTUBE_USER }}
      SITE_DDTUBE_PASS: ${{ secrets.SITE_DDTUBE_PASS }}
      SITE_E4DS_USER: ${{ secrets.SITE_E4DS_USER }}
      SITE_E4DS_PASS: ${{ secrets.SITE_E4DS_PASS }}
      SITE_TALKIT_USER: ${{ secrets.SITE_TALKIT_USER }}
      SITE_TALKIT_PASS: ${{ secrets.SITE_TALKIT_PASS }}
      SITE_DUBIZ_USER: ${{ secrets.SITE_DUBIZ_USER }}
      SITE_DUBIZ_PASS: ${{ secrets.SITE_DUBIZ_PASS }}
      SITE_CLOIT_USER: ${{ secrets.SITE_CLOIT_USER }}
      SITE_CLOIT_PASS: ${{ secrets.SITE_CLOIT_PASS }}

    steps:
      - uses: actions/checkout@v4

      - name: Python + Playwright environment
        uses: ./.github/actions/setup-runner

      - name: Run tests
        run: pytest -q

      # memory, /dev/shm, display: what decides whether Chromium can render
      - name: Runner diagnostics
        run: scripts/runner_diag.sh

      - name: Scrape webinars + publish dataset
        # a wedged browser must not hold the runner for hours; later steps
        # (always()) still publish the preserved data
        timeout-minutes: 45
        env:
          WEBINAR_HEADED: "1"
          # Save rendered HTML + JSON API responses of these hosts for diagnosis
          # (uploaded below as the "scrape-debug" artifact, kept 7 days).
          WEBINAR_DEBUG_DIR: debug
          WEBINAR_DEBUG_HOSTS: "allshowtv.com,cloit.com"
        # headed Chromium via the desktop session or Xvfb (scripts/with_display.sh)
        run: scripts/with_display.sh python -m webinar.pipeline -v --scraped-out "$RUNNER_TEMP/scraped.json"

      - name: Upload scrape debug captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Auto-register (enabled sites only)
        run: python -m webinar.registrar ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} -v
        continue-on-error: true

      - name: Sync Google Calendar
        # Registration is intentionally disabled for every source until each
        # form is verified. Sync the collected schedule regardless of that flag.
        run: python -m webinar.calendar_sync --all --strict -v

      # Mirror the just-scraped + registered dataset into docs (no second scrape).
      - name: Republish docs (json + ics)
        if: always()
        run: cp data/webinars.json docs/webinars.json && python -m webinar.ics_export

      # Per-source coverage so a silently-broken scraper (0 results) is visible.
      - name: Report source coverage
        if: always()
        run: python -m webinar.coverage >> "$GITHUB_STEP_SUMMARY"

      # Race-safe: if another workflow pushed meanwhile, reset to the latest main
      # and re-apply this run's saved scrape instead of failing the push.
      - name: Commit updated data
        if: always()
        run: >-
          scripts/commit_data.sh "chore: daily webinar sync $(date -u +%Y-%m-%d)"
          bash -c '[ ! -f "$RUNNER_TEMP/scraped.json" ] ||
          python -m webinar.pipeline --merge-from "$RUNNER_TEMP/scraped.json"'
