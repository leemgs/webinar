name: sharedit sync (self-hosted)

# sharedit.co.kr answers GitHub-hosted runners with a Cloudflare managed
# challenge (cf-mitigated: challenge); a self-hosted runner on an ordinary
# home/office network browses it like any visitor. The daily sync already runs
# on the self-hosted runner and scrapes sharedit itself, so this extra pass
# (40 minutes later, sharedit only) is OPT-IN: set the repository variable
# SHAREDIT_SELF_HOSTED = true (Settings → Secrets and variables → Actions →
# Variables). While enabled, the daily sync skips sharedit and this job owns it.
# Security: only use a self-hosted runner on a public repo if fork pull-request
# workflows require approval (Settings → Actions → General). This workflow
# itself never runs on pull requests.
on:
  schedule:
    - cron: "40 0 * * *"    # 09:40 KST (after the 08:00 daily sync)
    - cron: "40 12 * * *"   # 21:40 KST (after the 20:00 daily sync)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webinar-daily      # never overlap the daily sync
  cancel-in-progress: false

jobs:
  sharedit:
    if: vars.SHAREDIT_SELF_HOSTED == 'true'
    runs-on: self-hosted
    env:
      PYTHONPATH: src
      WEBINAR_HEADED: "1"    # a real browser window, as a visitor would use
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      GOOGLE_ACCOUNTS_YAML: ${{ secrets.GOOGLE_ACCOUNTS_YAML }}
      CALENDAR_WRITE_INTERVAL_SECONDS: "1.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Python + Playwright environment
        uses: ./.github/actions/setup-runner

      - name: Scrape sharedit
        run: scripts/with_display.sh python -m webinar.pipeline --site sharedit -v --scraped-out "$RUNNER_TEMP/sharedit.json"

      - name: Commit and push
        run: >-
          scripts/commit_data.sh "chore: sharedit sync $(date -u +%Y-%m-%d)"
          python -m webinar.pipeline --merge-from "$RUNNER_TEMP/sharedit.json"

      - name: Sync Google Calendar
        run: python -m webinar.calendar_sync --all --strict -v
